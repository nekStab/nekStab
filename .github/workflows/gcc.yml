name: GCC Build

on:
  workflow_dispatch:
  push:
    branches: [RANS_update]
  pull_request:
    branches: [RANS_update]

env:
  NEKSTAB_SOURCE_ROOT: ${{ github.workspace }}
  NEK_SOURCE_ROOT: ${{ github.workspace }}/Nek5000

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout nekStab
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin liblapack-dev libblas-dev

      - name: Clone Nek5000
        run: |
          git clone --depth=1 https://github.com/Nek5000/Nek5000.git
          cd Nek5000/tools && ./maketools genmap genbox

      - name: Build cylinder DNS example
        run: |
          export PATH=$NEK_SOURCE_ROOT/bin:$NEKSTAB_SOURCE_ROOT/bin:$PATH
          cd examples/cylinder/dns
          NEKSTAB_FC=gcc mks 1cyl

      - name: Run cylinder DNS (short test)
        run: |
          export PATH=$NEK_SOURCE_ROOT/bin:$NEKSTAB_SOURCE_ROOT/bin:$PATH
          cd examples/cylinder/dns
          # Modify for short CI test run
          sed -i 's/endTime = .*/endTime = 0.1/' 1cyl.par
          mpirun -np 2 --oversubscribe ./nek5000 > ci.log 2>&1 &
          PID=$!
          sleep 60
          kill $PID 2>/dev/null || true
          # Check if simulation started successfully
          grep -q "Step" ci.log && echo "Simulation started successfully"
