name: CI Build

on:
  workflow_dispatch:
  push:
    branches: [RANS_update]
  pull_request:
    branches: [RANS_update]

env:
  NEKSTAB_SOURCE_ROOT: ${{ github.workspace }}
  NEK_SOURCE_ROOT: ${{ github.workspace }}/Nek5000

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        toolchain:
          - {compiler: gcc, version: 14}
        include:
          # Intel ifx only on Linux (not supported on macOS)
          - os: ubuntu-latest
            toolchain: {compiler: intel, version: '2024.2'}

    steps:
      - name: Checkout nekStab
        uses: actions/checkout@v4

      - name: Setup Fortran
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Install MPI and BLAS (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin liblapack-dev libblas-dev

      - name: Install Intel MKL (for Intel compiler)
        if: matrix.toolchain.compiler == 'intel'
        run: |
          # Add Intel APT repository
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"
          sudo apt-get update
          # Install MKL (needed for -qmkl flag)
          sudo apt-get install -y intel-oneapi-mkl-devel

      - name: Install MPI (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install open-mpi

      - name: Configure MPI for Intel compilers
        if: matrix.toolchain.compiler == 'intel'
        run: |
          # Tell OpenMPI to use Intel compilers
          echo "OMPI_FC=ifx" >> $GITHUB_ENV
          echo "OMPI_CC=icx" >> $GITHUB_ENV
          echo "OMPI_CXX=icpx" >> $GITHUB_ENV

      - name: Clone Nek5000
        run: |
          git clone --depth=1 https://github.com/Nek5000/Nek5000.git

      - name: Build Nek5000 tools
        run: |
          cd Nek5000/tools
          # Nek5000 tools (genmap, genbox) are serial - always build with GCC
          # since maketools doesn't recognize ifx yet
          FC=gfortran CC=gcc ./maketools genmap genbox

      - name: Build cylinder DNS example
        run: |
          export PATH=$NEK_SOURCE_ROOT/bin:$NEKSTAB_SOURCE_ROOT/bin:$PATH
          cd examples/cylinder/dns
          if [ "${{ matrix.toolchain.compiler }}" = "intel" ]; then
            # Source MKL environment for Intel build
            source /opt/intel/oneapi/mkl/latest/env/vars.sh
            NEKSTAB_FC=ifx mks 1cyl
          else
            NEKSTAB_FC=gcc mks 1cyl
          fi

      - name: Verify executable
        run: |
          cd examples/cylinder/dns
          ls -la nek5000
          file nek5000
