name: CI Build

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  NEKSTAB_SOURCE_ROOT: ${{ github.workspace }}
  NEK_SOURCE_ROOT: ${{ github.workspace }}/Nek5000

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.version }} / ${{ matrix.mpi }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
        toolchain:
          - {compiler: gcc, version: 14}
        mpi: [openmpi, mpich]
        exclude:
          # FFTW Homebrew formula depends on open-mpi, conflicts with mpich
          - os: macos-26
            mpi: mpich
        include:
          # Intel ifort (classic) - final version before discontinuation
          - os: ubuntu-latest
            toolchain: {compiler: intel-classic, version: '2024.2'}
            mpi: intelmpi
          # Intel ifx (LLVM-based) - current/modern compiler
          - os: ubuntu-latest
            toolchain: {compiler: intel, version: '2025.2'}
            mpi: intelmpi

    steps:
      - name: Checkout nekStab
        uses: actions/checkout@v4

      - name: Setup Fortran
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Install MPI, BLAS, and FFTW3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Install MPI (skip for intelmpi - installed separately with Intel oneAPI)
          if [ "${{ matrix.mpi }}" = "openmpi" ]; then
            sudo apt-get install -y libopenmpi-dev openmpi-bin
          elif [ "${{ matrix.mpi }}" = "mpich" ]; then
            sudo apt-get install -y libmpich-dev mpich
          fi
          sudo apt-get install -y liblapack-dev libblas-dev libfftw3-dev

      - name: Install Intel MKL and MPI (for Intel compilers)
        if: matrix.toolchain.compiler == 'intel' || matrix.toolchain.compiler == 'intel-classic'
        run: |
          # Add Intel APT repository
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"
          sudo apt-get update
          # Install MKL and Intel MPI
          sudo apt-get install -y intel-oneapi-mkl-devel intel-oneapi-mpi-devel

      - name: Install MPI and FFTW3 (macOS)
        if: runner.os == 'macOS'
        run: |
          # FFTW bottle depends on open-mpi, so we only support OpenMPI on macOS
          brew install open-mpi fftw

      - name: Configure Intel MPI environment
        if: matrix.mpi == 'intelmpi'
        run: |
          # Source Intel MPI environment and export to GITHUB_ENV
          source /opt/intel/oneapi/mpi/latest/env/vars.sh
          # Set compilers based on toolchain
          # Note: ifort uses icx/icpx for C/C++ (icc/icpc deprecated in oneAPI 2024+)
          if [ "${{ matrix.toolchain.compiler }}" = "intel-classic" ]; then
            echo "I_MPI_FC=ifort" >> $GITHUB_ENV
            echo "I_MPI_CC=icx" >> $GITHUB_ENV
            echo "I_MPI_CXX=icpx" >> $GITHUB_ENV
          else
            echo "I_MPI_FC=ifx" >> $GITHUB_ENV
            echo "I_MPI_CC=icx" >> $GITHUB_ENV
            echo "I_MPI_CXX=icpx" >> $GITHUB_ENV
          fi
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Clone Nek5000
        run: |
          git clone --depth=1 https://github.com/Nek5000/Nek5000.git

      - name: Build Nek5000 tools
        run: |
          cd Nek5000/tools
          # Nek5000 tools (genmap, genbox) are serial - always build with GCC
          # since maketools doesn't recognize ifx yet
          FC=gfortran CC=gcc ./maketools genmap genbox

      - name: Build cylinder CI test
        run: |
          export PATH=$NEK_SOURCE_ROOT/bin:$NEKSTAB_SOURCE_ROOT/bin:$PATH
          cd example/cylinder/ci_test
          if [ "${{ matrix.toolchain.compiler }}" = "intel" ]; then
            source /opt/intel/oneapi/setvars.sh --force || true
            NEKSTAB_FC=ifx mks 1cyl
          elif [ "${{ matrix.toolchain.compiler }}" = "intel-classic" ]; then
            source /opt/intel/oneapi/setvars.sh --force || true
            NEKSTAB_FC=ifort mks 1cyl
          else
            NEKSTAB_FC=gcc mks 1cyl
          fi

      - name: Run smoke test (10 timesteps)
        run: |
          cd example/cylinder/ci_test
          if [ "${{ matrix.toolchain.compiler }}" = "intel" ] || [ "${{ matrix.toolchain.compiler }}" = "intel-classic" ]; then
            source /opt/intel/oneapi/setvars.sh --force || true
            # Enable MKL support for AMD CPUs (GitHub runners may be AMD)
            export MKL_DEBUG_CPU_TYPE=5
          fi
          echo "1cyl" > SESSION.NAME
          echo "$(pwd)/" >> SESSION.NAME
          # SIZE now supports lpmin=1 for CI flexibility
          # Try 2 processes, fall back to 1 if needed
          mpirun -np 2 ./nek5000 || mpirun -np 1 ./nek5000
          echo "Test completed successfully"

      - name: Verify output
        run: |
          cd example/cylinder/ci_test
          ls -la nek5000
          # Check logfile exists and contains "finished" or similar
          if grep -q "FINISHED RUN" logfile 2>/dev/null || grep -q "End of time-step loop" logfile 2>/dev/null; then
            echo "Simulation completed successfully"
          else
            echo "WARNING: Could not verify simulation completion in logfile"
            tail -50 logfile 2>/dev/null || true
          fi
