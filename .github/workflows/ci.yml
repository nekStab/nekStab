name: CI Build

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

env:
  NEKSTAB_SOURCE_ROOT: ${{ github.workspace }}
  NEK_SOURCE_ROOT: ${{ github.workspace }}/Nek5000

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.toolchain.compiler }}-${{ matrix.toolchain.version }} / ${{ matrix.mpi }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
        toolchain:
          - {compiler: gcc, version: 14}
        mpi: [openmpi, mpich]
        exclude:
          # FFTW Homebrew formula depends on open-mpi, conflicts with mpich
          - os: macos-26
            mpi: mpich
        include:
          # Intel ifx (LLVM-based) - current/modern compiler
          # Note: ifort (classic) removed - deprecated in oneAPI 2025, runtime requires Intel CPUs
          - os: ubuntu-latest
            toolchain: {compiler: intel, version: '2025.2'}
            mpi: intelmpi

    steps:
      - name: Checkout nekStab
        uses: actions/checkout@v4

      - name: Setup Fortran
        uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}

      - name: Install MPI, BLAS, and FFTW3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Install MPI (skip for intelmpi - installed separately with Intel oneAPI)
          if [ "${{ matrix.mpi }}" = "openmpi" ]; then
            sudo apt-get install -y libopenmpi-dev openmpi-bin
          elif [ "${{ matrix.mpi }}" = "mpich" ]; then
            sudo apt-get install -y libmpich-dev mpich
          fi
          sudo apt-get install -y liblapack-dev libblas-dev libfftw3-dev

      - name: Install Intel MKL and MPI (for Intel compilers)
        if: matrix.toolchain.compiler == 'intel' || matrix.toolchain.compiler == 'intel-classic'
        run: |
          # Add Intel APT repository
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo apt-key add -
          sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"
          sudo apt-get update
          # Install MKL, Intel MPI, and gfortran (needed for Nek5000 tools)
          sudo apt-get install -y intel-oneapi-mkl-devel intel-oneapi-mpi-devel gfortran liblapack-dev libblas-dev

      - name: Install MPI and FFTW3 (macOS)
        if: runner.os == 'macOS'
        run: |
          # FFTW bottle depends on open-mpi, so we only support OpenMPI on macOS
          brew install open-mpi fftw

      - name: Configure Intel MPI environment
        if: matrix.mpi == 'intelmpi'
        run: |
          # Source Intel MPI environment and export to GITHUB_ENV
          source /opt/intel/oneapi/mpi/latest/env/vars.sh
          # Set compilers based on toolchain
          # Note: ifort uses icx/icpx for C/C++ (icc/icpc deprecated in oneAPI 2024+)
          if [ "${{ matrix.toolchain.compiler }}" = "intel-classic" ]; then
            echo "I_MPI_FC=ifort" >> $GITHUB_ENV
            echo "I_MPI_CC=icx" >> $GITHUB_ENV
            echo "I_MPI_CXX=icpx" >> $GITHUB_ENV
          else
            echo "I_MPI_FC=ifx" >> $GITHUB_ENV
            echo "I_MPI_CC=icx" >> $GITHUB_ENV
            echo "I_MPI_CXX=icpx" >> $GITHUB_ENV
          fi
          echo "PATH=$PATH" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> $GITHUB_ENV

      # --- Nek5000 setup (uses our setup script) ---
      - name: Setup Nek5000
        run: |
          # Nek5000 tools (genmap, genbox) need gfortran - maketools doesn't recognize ifx
          # Temporarily override FC/CC for the setup script
          FC=gfortran CC=gcc yes "" | ./Nek5000setup.sh

      - name: Set environment paths
        run: |
          # Export paths as documented in README.md
          echo "NEKSTAB_SOURCE_ROOT=${{ github.workspace }}" >> $GITHUB_ENV
          echo "NEK_SOURCE_ROOT=${{ github.workspace }}/Nek5000" >> $GITHUB_ENV
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/Nek5000/bin" >> $GITHUB_PATH

      # --- Build and run CI test ---
      - name: Build cylinder CI test
        run: |
          cd example/cylinder/ci_test
          mks 1cyl

      - name: Run smoke test (10 timesteps, 2 procs)
        run: |
          ulimit -s unlimited
          cd example/cylinder/ci_test
          echo "1cyl" > SESSION.NAME
          echo "$(pwd)/" >> SESSION.NAME
          mpirun -np 2 ./nek5000 > logfile 2>&1

      - name: Verify output
        run: |
          cd example/cylinder/ci_test
          cat logfile | tail -20
          if grep -q "run successful" logfile; then
            echo "Simulation completed successfully"
          else
            echo "ERROR: Simulation did not complete"
            exit 1
          fi
